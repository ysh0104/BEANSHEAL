<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D583E"/>
      <stop offset="100%" stop-color="#1B3E2A"/>
    </linearGradient>
  </defs>
  <!-- Dark Green Background Circle -->
  <circle cx="50" cy="50" r="48" fill="url(#bgGrad)"/>
  
  <!-- Crisp White B + Leaf Symbol -->
  <g fill="none" stroke="#FFFFFF" stroke-linecap="round" stroke-linejoin="round">
    <!-- Vertical stem -->
    <path d="M 37 22 V 78" stroke-width="5"/>
    <!-- Top loop of B -->
    <path d="M 37 22 H 56 C 70 22 70 48 52 48 H 37" stroke-width="5"/>
    <!-- Bottom loop of B -->
    <path d="M 37 48 H 58 C 73 48 73 78 37 78" stroke-width="5"/>
    <!-- Leaf motif inside bottom loop -->
    <path d="M 37 78 C 37 63 53 62 52 72 C 51 77 43 78 37 78 Z" fill="#FFFFFF" stroke="none"/>
    <path d="M 37 78 Q 45 69 52 72" stroke="#2D583E" stroke-width="2"/>
  </g>
</svg>
