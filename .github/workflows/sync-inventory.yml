name: Sync Ecount Inventory (Excel Bot)

on:
  repository_dispatch:
    types: [trigger-sync]
  workflow_dispatch:
    inputs:
      target:
        description: "stock = 재고현황, ledger_bulk = 재고수불부 일괄"
        required: false
        default: "stock"
        type: choice
        options:
          - stock
          - lot
          - ledger
          - ledger_bulk
      prod_cd:
        description: "재고수불부 품목코드 (ledger 전용)"
        required: false
        type: string
      prod_nm:
        description: "품목명 (ledger 전용, 선택)"
        required: false
        type: string
      period_from:
        description: "조회 시작일 YYYY/MM/DD (ledger, 비우면 자동)"
        required: false
        type: string
      period_to:
        description: "조회 종료일 YYYY/MM/DD (ledger, 비우면 자동)"
        required: false
        type: string

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: Run Ecount Excel bot
        run: npx tsx scripts/ecountBot.ts
        env:
          ECOUNT_BOT_TARGET: ${{ github.event.inputs.target || github.event.client_payload.target || 'stock' }}
          ECOUNT_LEDGER_PROD_CD: ${{ github.event.inputs.prod_cd || github.event.client_payload.prod_cd || '' }}
          ECOUNT_LEDGER_PROD_NM: ${{ github.event.inputs.prod_nm || github.event.client_payload.prod_nm || '' }}
          ECOUNT_LEDGER_FROM: ${{ github.event.inputs.period_from || github.event.client_payload.period_from || '' }}
          ECOUNT_LEDGER_TO: ${{ github.event.inputs.period_to || github.event.client_payload.period_to || '' }}
          ECOUNT_COM_CODE: ${{ secrets.ECOUNT_COM_CODE }}
          ECOUNT_ID: ${{ secrets.ECOUNT_ID }}
          ECOUNT_PW: ${{ secrets.ECOUNT_PW }}
          ECOUNT_STOCK_MENU_DEPTH1: ${{ secrets.ECOUNT_STOCK_MENU_DEPTH1 }}
          ECOUNT_STOCK_MENU_DEPTH2: ${{ secrets.ECOUNT_STOCK_MENU_DEPTH2 }}
          ECOUNT_STOCK_MENU_URL: ${{ secrets.ECOUNT_STOCK_MENU_URL }}
          ECOUNT_LEDGER_MENU_URL: ${{ secrets.ECOUNT_LEDGER_MENU_URL }}
          ECOUNT_LEDGER_PRG_ID: ${{ secrets.ECOUNT_LEDGER_PRG_ID || 'E040702' }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Upload debug screenshot on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ecount-bot-debug
          path: downloads/
          if-no-files-found: ignore
